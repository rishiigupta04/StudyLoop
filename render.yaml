# Render Blueprint â€” backend only (frontend stays on Vercel, DB on Supabase).
services:
  - type: web
    name: studyloop-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: prod
      - key: CORS_ORIGINS
        value: https://studyloopp.vercel.app,https://study-loop-pink.vercel.app,https://studylooop.vercel.app
      - key: CLASSIFIER
        value: onnx    # Tier 1c fine-tuned intent model; the Dockerfile fetches the pinned bundle at build time
                       # Rollback WITHOUT a rebuild: set CLASSIFIER=regex in the Render dashboard (the image still
                       # holds the bundle; the app also falls back to the regex by itself if the bundle won't load).
                       # A dashboard override may be reset by a blueprint sync (not verified for this variable):
                       # to make the rollback durable, commit value: regex here.
      - key: CHECKPOINTER
        value: postgres    # Tier 1b conversation memory; DATABASE_URL must be the Supabase *session pooler*
                           # URL (the direct db.<ref>.supabase.co host is IPv6-only; Render can't reach it)
      - key: REQUIRE_AUTH
        value: "true"    # Tier 0b: the frontend signs in with Supabase Auth
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TRANSCRIPT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY   # hosted STT (Saaras) + TTS (Bulbul), roadmap D14; empty = Groq Whisper / browser voice
        sync: false
      - key: HF_TOKEN
        sync: false
